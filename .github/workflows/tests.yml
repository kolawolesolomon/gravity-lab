name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python -m py_compile main.py physics.py
      - name: Verify Pygame rendering and input
        if: runner.os == 'Linux'
        run: python smoke_render.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: gravity-lab-preview
          path: gravity-lab.png
